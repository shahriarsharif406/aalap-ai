<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aalap — Every child has something to say</title>
<meta name="description" content="Aalap builds a personal communication board for children with speech, hearing, vision or intellectual disabilities — from a single photo, in 8 languages.">
<meta name="theme-color" content="#4b32e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<header class="top">
  <h1 class="sr">Aalap — Every child has something to say</h1>
  <a class="brand" href="index.html" aria-label="Aalap home">
    <img src="icon.svg" alt="" width="44" height="44">
    <span><b>Aalap</b><small id="tag"></small></span>
  </a>
  <label class="langsel">
    <span class="sr" id="langLbl">Language</span>
    <select id="langSel" aria-labelledby="langLbl"></select>
  </label>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabs" id="tabs" aria-label="Main"></nav>

<button id="sosBtn" class="sos" type="button"></button>

<div id="sosOverlay" class="sos-overlay" hidden role="alertdialog" aria-live="assertive">
  <div class="sos-big">🆘</div>
  <div class="sos-say" id="sosSay"></div>
  <div class="sos-stop" id="sosStop"></div>
</div>

<div id="onboard" class="onboard" hidden role="dialog" aria-modal="true" aria-labelledby="obTitle"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="picker" class="picker" aria-label="Pick">
  <form method="dialog"><button class="x" aria-label="Close">✕</button></form>
  <div id="pickerGrid" class="grid"></div>
</dialog>

<dialog id="shareDlg" class="picker share" aria-label="Share">
  <form method="dialog"><button class="x" aria-label="Close">✕</button></form>
  <div id="shareBody"></div>
</dialog>

<noscript><p style="padding:24px;font-size:1.2rem">Aalap needs JavaScript to run.</p></noscript>

<script src="vendor/qrcode.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
